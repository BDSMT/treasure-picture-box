name: build

# 打 tag（比如 v1.0.0）自动构建并发布；
# 也可以在 Actions 页面手动点 Run workflow 只构建不发版。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: 构建发布包
        run: |
          python -m pip install --upgrade pip
          python build.py

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: win64
          path: release/*.zip
          if-no-files-found: error

      - name: 发布到 Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
          body: |
            Windows 10 / 11 (x64) 免安装版本。

            下载后解压到任意可写目录，双击 `藏图盒.exe` 即可。
            不需要装 Python，不需要联网。

            > 首次运行会被 SmartScreen 拦截（没有代码签名），
            > 点「更多信息」→「仍要运行」。
